name: Build Case Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  apk:
    name: Signed Android APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.CASEDECK_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check Android SDK (preinstalled on GitHub runners)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore release keystore from secrets
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.CASEDECK_KEYSTORE_BASE64 }}
          PW: ${{ secrets.CASEDECK_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.CASEDECK_KEY_ALIAS }}
        run: |
          # Keep only base64 characters, so stray spaces or Windows line endings from copy and paste do no harm
          printf '%s' "$KS" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/casedeck-release.jks" || { echo "::error::CASEDECK_KEYSTORE_BASE64 is not valid. Paste the whole of casedeck-release.jks.base64.txt and nothing else."; exit 1; }
          echo "Keystore restored: $(wc -c < "$RUNNER_TEMP/casedeck-release.jks") bytes"
          PW="$(printf '%s' "$PW" | tr -d '\r\n')"; AL="$(printf '%s' "$AL" | tr -d '\r\n ')"
          keytool -list -keystore "$RUNNER_TEMP/casedeck-release.jks" -storepass "$PW" -alias "$AL" > /dev/null || { echo "::error::The keystore opened but the password or alias does not match. Check CASEDECK_KEYSTORE_PASSWORD (the text after storePassword=) and CASEDECK_KEY_ALIAS (casedeck)."; exit 1; }
          echo "Keystore, password and alias verified."
          echo "CASEDECK_KEYSTORE_PATH=$RUNNER_TEMP/casedeck-release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          CASEDECK_KEYSTORE_PASSWORD: ${{ secrets.CASEDECK_KEYSTORE_PASSWORD }}
          CASEDECK_KEY_ALIAS: ${{ secrets.CASEDECK_KEY_ALIAS }}
          CASEDECK_KEY_PASSWORD: ${{ secrets.CASEDECK_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CaseDeck-1.0-apk
          path: app/build/outputs/apk/release/*.apk

  web:
    name: iPhone and iPad web app (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
