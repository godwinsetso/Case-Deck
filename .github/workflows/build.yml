name: Build Case Deck

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  apk:
    name: Signed Android APK
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.CASEDECK_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check Android SDK (preinstalled on GitHub runners)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          PW: ${{ secrets.CASEDECK_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.CASEDECK_KEY_ALIAS }}
        run: |
          # The keystore is stored encrypted in signing/ and unlocked with the keystore password secret.
          PW="$(printf '%s' "$PW" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')"
          AL="$(printf '%s' "${AL:-casedeck}" | tr -d '\r\n ')"; [ -n "$AL" ] || AL=casedeck
          echo "Password secret length: ${#PW} characters (expected 20). Alias: $AL"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/casedeck-release.jks.enc -out "$RUNNER_TEMP/casedeck-release.jks" -pass env:PW || { echo "::error::Could not unlock the keystore. CASEDECK_KEYSTORE_PASSWORD must be exactly the text after storePassword= in keystore.properties (20 characters, nothing else)."; exit 1; }
          export PW
          keytool -list -keystore "$RUNNER_TEMP/casedeck-release.jks" -storepass:env PW -alias "$AL" > /dev/null || { echo "::error::Keystore unlocked but alias '$AL' was not found. Set CASEDECK_KEY_ALIAS to casedeck."; exit 1; }
          echo "Keystore unlocked and verified."
          echo "CASEDECK_KEYSTORE_PATH=$RUNNER_TEMP/casedeck-release.jks" >> "$GITHUB_ENV"
          echo "CASEDECK_KEY_ALIAS_CLEAN=$AL" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          CASEDECK_KEYSTORE_PASSWORD: ${{ secrets.CASEDECK_KEYSTORE_PASSWORD }}
          CASEDECK_KEY_ALIAS: ${{ secrets.CASEDECK_KEY_ALIAS || 'casedeck' }}
          CASEDECK_KEY_PASSWORD: ${{ secrets.CASEDECK_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CaseDeck-1.0-apk
          path: app/build/outputs/apk/release/*.apk

  web:
    name: iPhone and iPad web app (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
